<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vice Harbor — a harbour crime story</title>
<style>
  :root {
    --ink: #06050c;
    --cream: #f2ece0;
    --gold: #ffd45e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ink);
    color: var(--cream);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
  }
  canvas#view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
    background: #0b0912;
  }
  canvas#hud {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(4,3,9,0.45) 100%);
    mix-blend-mode: multiply;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0912;
    color: var(--gold);
    font: 600 13px ui-monospace, monospace;
    letter-spacing: 0.14em;
    transition: opacity 0.4s ease;
    z-index: 10;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .mark {
    text-align: center;
    line-height: 2;
  }
  #boot .mark strong {
    display: block;
    font: 700 30px ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.02em;
    color: #ffe9c9;
  }
  #credit {
    position: absolute;
    right: 10px;
    bottom: 6px;
    font: 500 9px ui-monospace, monospace;
    letter-spacing: 0.08em;
    color: rgba(242,236,224,0.28);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="hud"></canvas>
    <div id="vignette"></div>
    <div id="boot">
      <div class="mark">
        <strong>VICE HARBOR</strong>
        loading the harbour&hellip;
      </div>
    </div>
    <div id="credit">VICE HARBOR &middot; dusk patrol build</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
